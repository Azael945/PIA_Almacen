[tool.poetry]
name = "pia-almacen"
version = "1.0.0"
description = "API de gestión de almacén (FastAPI + MySQL)"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = ">=0.115.0"
uvicorn = ">=0.30.0"
pydantic = ">=2.7.0"
email-validator = ">=2.1.0"
sqlalchemy = ">=2.0.0"
pymysql = ">=1.1.0"
bcrypt = ">=4.1.0"
pyjwt = ">=2.8.0"
python-dotenv = ">=1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
